
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Wiki Exporter — Category Export</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="category-page">

    <header>
        <h1>Wiki Exporter</h1>

        <p class="tagline">
            No AI. Human crawler. For lazy people.
        </p>
    </header>

    <hr>

    <main>

        <h2 id="category-title">Category Export</h2>

        <div class="panel">

            <p>
                Load the category to view its
                available articles.
            </p>

            <button id="load-category">
                Load Category
            </button>

            <p id="status" role="status"></p>

            <div id="article-list"></div>

        </div>

    </main>

    <footer>
        Wiki Exporter
    </footer>

    <script src="category.js"></script>
    <script src="category-page.js"></script>

</body>

</html>

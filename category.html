<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Wiki Exporter — Category Export</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="category-page">

    <header>
        <h1>Wiki Exporter</h1>

        <p class="tagline">
            No AI. Human crawler. For lazy people.
        </p>
    </header>

    <hr>

    <main>

        <h2 id="category-title">Category Export</h2>

        <div class="panel">

            <p>
                Load the category to view its
                available articles.
            </p>

            <button id="load-category">
                Load Category
            </button>

            <p id="status" role="status"></p>

            <div id="filter-controls">

                <div class="filter-field">

                    <label for="article-search">
                        Search Articles
                    </label>

                    <input
                        type="search"
                        id="article-search"
                        placeholder="Filter article titles..."
                        autocomplete="off"
                        disabled
                    >

                </div>

                <div class="sort-field">

                    <label for="article-sort">
                        Sort Order
                    </label>

                    <select id="article-sort" disabled>

                        <option value="asc">A–Z</option>

                        <option value="desc">Z–A</option>

                    </select>

                </div>

            </div>

            <div class="toolbar" id="selection-toolbar">

                <button id="select-all"
                        class="secondary"
                        disabled>
                    Select All
                </button>

                <button id="select-none"
                        class="secondary"
                        disabled>
                    Select None
                </button>

                <button id="select-filtered"
                        class="secondary"
                        disabled>
                    Select Filtered
                </button>

                <button id="deselect-filtered"
                        class="secondary"
                        disabled>
                    Deselect Filtered
                </button>

            </div>

            <div id="selection-information">

                <span id="selection-count" role="status">
                    0 of 0 selected
                </span>

                <span id="batch-limit">
                    0 / 100 batch limit
                </span>

            </div>

            <p id="filter-empty" hidden>
                No matching articles.
            </p>

            <div id="article-list"></div>

            <fieldset id="format-options">

                <legend>Export Format</legend>

                <label class="export-option">
                    <input type="radio" name="export-format" value="md" checked>
                    Markdown (.md)
                </label>

                <label class="export-option">
                    <input type="radio" name="export-format" value="docx">
                    Microsoft Word (.docx)
                </label>

            </fieldset>

            <fieldset id="output-options">

                <legend>Output Mode</legend>

                <label class="export-option">

                    <input type="radio"
                           name="output-mode"
                           value="combined"
                           checked>

                    <span id="combined-label">
                        Combined document (.md)
                    </span>

                </label>

                <label class="export-option">

                    <input type="radio"
                           name="output-mode"
                           value="separate">

                    <span id="separate-label">
                        Separate .md files (.zip)
                    </span>

                </label>

            </fieldset>

            <div class="toolbar">

                <button id="export-batch" disabled>
                    Export Selected Articles
                </button>

                <button id="cancel-batch" class="secondary" disabled>
                    Cancel Export
                </button>

            </div>

            <progress id="batch-progress" value="0" max="100" hidden></progress>

            <p id="batch-status" role="status"></p>

            <pre id="batch-report" hidden></pre>


        </div>

    </main>

    <footer>
        Wiki Exporter
    </footer>

    <script src="vendor/turndown.js"></script>
    <script src="vendor/turndown-plugin-gfm.js"></script>
    <script src="vendor/jszip.min.js"></script>

    <script src="vendor/docx.js"></script>
    <script src="vendor/docx-math.js"></script>
    <script src="vendor/docx-html.js"></script>

    <script src="docx-exporter.js"></script>
    <script src="settings.js"></script>
    <script src="request.js"></script>
    <script src="category.js"></script>
    <script src="category-page.js"></script>
    <script src="batch.js"></script>

</body>

</html>

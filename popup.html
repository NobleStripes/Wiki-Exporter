<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <title>Wiki Exporter</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, sans-serif;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 12px;
      cursor: pointer;
    }

    #status {
      font-size: 12px;
    }
  </style>
</head>

<body class="popup-page">
  <h2>Wiki Exporter</h2>

  <p class="tagline">
    No AI. Human crawler. For lazy people.
  </p>

  <label for="export-format">
    Export Format
  </label>

  <select id="export-format">
    <option value="md">Markdown (.md)</option>
    <option value="docx">Microsoft Word (.docx)</option>
  </select>

  <button id="export">
    Export article
  </button>

  <button id="open-collection" class="secondary">
    Build Research Collection
  </button>

  <p id="status"></p>

  <script src="vendor/turndown.js"></script>
  <script src="vendor/turndown-plugin-gfm.js"></script>

  <script src="vendor/docx.js"></script>
  <script src="vendor/docx-math.js"></script>
  <script src="vendor/docx-html.js"></script>

  <script src="fidelity.js"></script>
    <script src="docx-exporter.js"></script>
  <script src="settings.js"></script>
  <script src="category.js"></script>
  <script src="popup.js"></script>
</body>

</html>
